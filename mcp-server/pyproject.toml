[project]
name = "karpathytalk-mcp"
version = "0.1.0"
description = "MCP server for the KarpathyTalk public read API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
karpathytalk-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.hatch.build.targets.wheel.sources]
"server.py" = "karpathytalk_mcp/__init__.py"
